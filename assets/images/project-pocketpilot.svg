<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="PocketPilot — Student Budget Tracker">
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="pp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pp-bg)"/>
  <!-- Subtle grid -->
  <g stroke="#00D4FF" stroke-width="0.5" opacity="0.08">
    <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400"/>
  </g>
  <!-- Phone frame -->
  <g>
    <rect x="200" y="60" width="200" height="300" rx="22" fill="#111827" stroke="url(#pp-accent)" stroke-width="2"/>
    <rect x="208" y="68" width="184" height="284" rx="16" fill="#0B1020"/>
    <!-- Top bar -->
    <rect x="220" y="78" width="60" height="6" rx="3" fill="#4F46E5"/>
    <rect x="220" y="90" width="100" height="14" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <!-- Wallet card -->
    <rect x="220" y="115" width="160" height="70" rx="10" fill="url(#pp-accent)"/>
    <rect x="232" y="130" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="232" y="144" width="90" height="14" rx="3" fill="#FFFFFF"/>
    <circle cx="358" cy="155" r="8" fill="#00E676"/>
    <!-- Stats bars -->
    <rect x="220" y="200" width="75" height="50" rx="8" fill="#1a1f3a" stroke="#00D4FF" stroke-width="0.6" opacity="0.9"/>
    <rect x="305" y="200" width="75" height="50" rx="8" fill="#1a1f3a" stroke="#4F46E5" stroke-width="0.6" opacity="0.9"/>
    <rect x="232" y="220" width="20" height="20" rx="4" fill="#00D4FF"/>
    <rect x="252" y="226" width="35" height="4" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="252" y="234" width="25" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <rect x="317" y="220" width="20" height="20" rx="4" fill="#00E676"/>
    <rect x="337" y="226" width="35" height="4" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="337" y="234" width="25" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <!-- Pie chart -->
    <g transform="translate(250 295)">
      <circle r="28" fill="none" stroke="#1a1f3a" stroke-width="10"/>
      <circle r="28" fill="none" stroke="#00D4FF" stroke-width="10" stroke-dasharray="80 176" transform="rotate(-90)"/>
      <circle r="28" fill="none" stroke="#4F46E5" stroke-width="10" stroke-dasharray="50 176" stroke-dashoffset="-80" transform="rotate(-90)"/>
      <circle r="28" fill="none" stroke="#00E676" stroke-width="10" stroke-dasharray="46 176" stroke-dashoffset="-130" transform="rotate(-90)"/>
    </g>
    <!-- Bars -->
    <g>
      <rect x="295" y="270" width="6" height="50" rx="2" fill="#00D4FF"/>
      <rect x="307" y="280" width="6" height="40" rx="2" fill="#4F46E5"/>
      <rect x="319" y="260" width="6" height="60" rx="2" fill="#00E676"/>
      <rect x="331" y="290" width="6" height="30" rx="2" fill="#00D4FF" opacity="0.6"/>
      <rect x="343" y="275" width="6" height="45" rx="2" fill="#4F46E5" opacity="0.6"/>
      <rect x="355" y="295" width="6" height="25" rx="2" fill="#00E676" opacity="0.6"/>
    </g>
  </g>
  <!-- PWA corner badge -->
  <g transform="translate(450 70)">
    <rect width="100" height="36" rx="18" fill="#0B1020" stroke="#00E676" stroke-width="1.4"/>
    <circle cx="20" cy="18" r="5" fill="#00E676"/>
    <text x="34" y="22" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PWA · OFFLINE</text>
  </g>
  <!-- Title -->
  <g font-family="Inter, Arial, sans-serif" fill="#FFFFFF">
    <text x="40" y="180" font-size="32" font-weight="800">PocketPilot</text>
    <text x="40" y="210" font-size="14" font-weight="500" fill="#00D4FF">Student Budget Tracker</text>
    <text x="40" y="245" font-size="11" font-weight="500" fill="#9ca3af">Progressive Web App · LocalStorage · Charts</text>
  </g>
  <!-- Decorative dots -->
  <g fill="#00D4FF">
    <circle cx="40" cy="80" r="3"/>
    <circle cx="55" cy="80" r="3" opacity="0.6"/>
    <circle cx="70" cy="80" r="3" opacity="0.3"/>
  </g>
</svg>
