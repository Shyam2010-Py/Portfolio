<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Python for Students">
    <defs>
        <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e1a"/>
            <stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9"/>
            <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <symbol id="hex" viewBox="-10 -10 20 20">
            <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
    </defs>

    <!-- Grid bg -->
    <g opacity="0.12" stroke="#06b6d4" stroke-width="0.5" fill="none">
        <path d="M 0 80 L 600 80 M 0 160 L 600 160 M 0 240 L 600 240 M 0 320 L 600 320"/>
        <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400"/>
    </g>
    <g opacity="0.25" color="#06b6d4">
        <use href="#hex" x="60" y="60" width="36" height="36"/>
        <use href="#hex" x="520" y="80" width="44" height="44"/>
        <use href="#hex" x="80" y="320" width="32" height="32"/>
        <use href="#hex" x="500" y="320" width="40" height="40"/>
    </g>
    <g opacity="0.4" fill="#22d3ee">
        <circle cx="50" cy="200" r="4"/><circle cx="560" cy="200" r="4"/>
        <circle cx="150" cy="40" r="3"/><circle cx="450" cy="360" r="3"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 380 50 L 460 50 L 460 90 L 520 90"/>
        <circle cx="380" cy="50" r="3" fill="#22d3ee"/><circle cx="520" cy="90" r="3" fill="#22d3ee"/>
        <rect x="430" y="65" width="20" height="20" rx="2"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 80 320 L 80 360 L 140 360"/>
        <path d="M 100 310 L 100 340"/>
        <circle cx="80" cy="320" r="3" fill="#22d3ee"/><circle cx="80" cy="360" r="3" fill="#22d3ee"/><circle cx="140" cy="360" r="3" fill="#22d3ee"/>
    </g>
    <g font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.55">
        <text x="40" y="120">01</text><text x="545" y="140">10</text>
        <text x="30" y="280">11</text><text x="555" y="290">01</text>
    </g>
    <g font-family="monospace" font-size="20" fill="#06b6d4" opacity="0.45" font-weight="bold">
        <text x="20" y="180">{ }</text><text x="545" y="240">{ }</text>
    </g>

    <!-- Main object shadow -->
    <ellipse cx="300" cy="335" rx="190" ry="8" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)"/>

    <!-- ===== PYTHON FOR STUDENTS: Notebook + Code Editor + Terminal ===== -->
    <g transform="translate(150, 100)">
        <!-- Open notebook (left) -->
        <g transform="translate(0, 0)">
            <!-- Notebook base -->
            <path d="M 0 20 L 0 200 L 95 215 L 95 35 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
            <!-- Notebook pages -->
            <path d="M 95 35 L 95 215 L 175 200 L 175 20 Z" fill="#111827" stroke="#06b6d4" stroke-width="1.2"/>
            <!-- Spine -->
            <line x1="95" y1="35" x2="95" y2="215" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
            <!-- Notebook lines -->
            <g stroke="#22d3ee" stroke-width="0.5" opacity="0.3">
                <line x1="100" y1="50" x2="170" y2="42"/>
                <line x1="100" y1="70" x2="170" y2="62"/>
                <line x1="100" y1="90" x2="170" y2="82"/>
                <line x1="100" y1="110" x2="170" y2="102"/>
                <line x1="100" y1="130" x2="170" y2="122"/>
                <line x1="100" y1="150" x2="170" y2="142"/>
                <line x1="100" y1="170" x2="170" y2="162"/>
                <line x1="100" y1="190" x2="170" y2="182"/>
            </g>
            <!-- Hand-written code on notebook -->
            <g font-family="monospace" font-size="7" fill="#22d3ee" opacity="0.9">
                <text x="105" y="50">def learn():</text>
                <text x="110" y="68">print("hi")</text>
                <text x="105" y="86">x = 10</text>
                <text x="110" y="104">return x</text>
            </g>
            <!-- Red margin line -->
            <line x1="103" y1="35" x2="103" y2="200" stroke="#ef4444" stroke-width="0.5" opacity="0.5"/>
        </g>

        <!-- Code editor (right) -->
        <g transform="translate(200, 0)">
            <rect x="0" y="0" width="200" height="200" rx="10" fill="url(#frame)" stroke="#06b6d4" stroke-width="1.2"/>
            <rect x="6" y="6" width="188" height="20" rx="6" fill="#1e293b"/>
            <rect x="6" y="20" width="188" height="6" fill="#1e293b"/>
            <circle cx="16" cy="16" r="3" fill="#ef4444"/>
            <circle cx="26" cy="16" r="3" fill="#fbbf24"/>
            <circle cx="36" cy="16" r="3" fill="#22c55e"/>
            <rect x="55" y="11" width="78" height="12" rx="3" fill="#0a0e1a"/>
            <text x="62" y="20" font-family="monospace" font-size="8" fill="#22d3ee">learn.py</text>

            <g font-family="monospace" font-size="9">
                <text x="14" y="48">
                    <tspan fill="#a78bfa">def</tspan><tspan fill="#fbbf24"> greet</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#f472b6">name</tspan><tspan fill="#e2e8f0">):</tspan>
                </text>
                <text x="22" y="62">
                    <tspan fill="#a78bfa">return</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#86efac">f"Hi </tspan><tspan fill="#e2e8f0">{</tspan><tspan fill="#f472b6">name</tspan><tspan fill="#e2e8f0">}"</tspan>
                </text>
                <text x="14" y="80">
                    <tspan fill="#e2e8f0"></tspan>
                </text>
                <text x="14" y="98">
                    <tspan fill="#f472b6">msg</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#fbbf24">greet</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"World"</tspan><tspan fill="#e2e8f0">)</tspan>
                </text>
                <text x="14" y="112">
                    <tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#f472b6">msg</tspan><tspan fill="#e2e8f0">)</tspan>
                </text>
                <text x="14" y="134">
                    <tspan fill="#64748b"># keep learning</tspan>
                </text>
            </g>
            <!-- Output line -->
            <line x1="14" y1="150" x2="186" y2="150" stroke="#1e293b" stroke-width="0.5"/>
            <text x="14" y="166" font-family="monospace" font-size="8" fill="#22c55e">→ Hi World</text>
            <!-- Terminal prompt -->
            <text x="14" y="186" font-family="monospace" font-size="8" fill="#22d3ee">$ python learn.py</text>
            <!-- Blinking cursor -->
            <rect x="118" y="180" width="6" height="2" fill="#22d3ee" opacity="0.9">
                <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
            </rect>
        </g>
    </g>

    <!-- Floating flowchart element (top right) -->
    <g transform="translate(440, 60)" opacity="0.85">
        <rect x="-12" y="-8" width="24" height="16" rx="3" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="7" fill="#22d3ee">if</text>
        <line x1="0" y1="8" x2="0" y2="20" stroke="#22d3ee" stroke-width="1"/>
        <text x="14" y="22" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="bold">Y</text>
        <text x="-20" y="22" font-family="monospace" font-size="10" fill="#22d3ee" font-weight="bold">N</text>
    </g>

    <!-- Floating function call (bottom right) -->
    <g transform="translate(465, 325)" opacity="0.9">
        <rect x="-30" y="-10" width="60" height="20" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="9" fill="#22d3ee">learn()</text>
    </g>

    <!-- Chip icon -->
    <g transform="translate(170, 130)">
        <rect width="22" height="22" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/>
        <rect x="5" y="5" width="12" height="12" rx="1" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
        <g stroke="#22d3ee" stroke-width="0.8" opacity="0.7">
            <line x1="-3" y1="6" x2="0" y2="6"/><line x1="-3" y1="11" x2="0" y2="11"/><line x1="-3" y1="16" x2="0" y2="16"/>
            <line x1="22" y1="6" x2="25" y2="6"/><line x1="22" y1="11" x2="25" y2="11"/><line x1="22" y1="16" x2="25" y2="16"/>
        </g>
    </g>

    <!-- Glowing P badge -->
    <g transform="translate(450, 165)">
        <circle r="48" fill="#22d3ee" opacity="0.18" filter="url(#softGlow)"/>
        <circle r="38" fill="#0a0e1a" stroke="url(#cGrad)" stroke-width="3"/>
        <circle r="32" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
        <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="url(#cGrad)">Py</text>
        <g stroke="#22d3ee" stroke-width="1.5" opacity="0.7">
            <line x1="0" y1="-30" x2="0" y2="-26"/><line x1="0" y1="26" x2="0" y2="30"/>
            <line x1="-30" y1="0" x2="-26" y2="0"/><line x1="26" y1="0" x2="30" y2="0"/>
        </g>
    </g>

    <!-- Subtle scan line -->
    <line x1="150" y1="210" x2="450" y2="210" stroke="#22d3ee" stroke-width="0.5" opacity="0.15"/>
</svg>