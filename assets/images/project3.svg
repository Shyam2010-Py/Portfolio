<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Microcontroller Hub">
    <defs>
        <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0e7490" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#0891b2" stop-opacity="0.2"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <symbol id="hex" viewBox="-10 -10 20 20">
            <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
    </defs>

    <g opacity="0.12" stroke="#06b6d4" stroke-width="0.5" fill="none">
        <path d="M 0 80 L 600 80 M 0 160 L 600 160 M 0 240 L 600 240 M 0 320 L 600 320"/>
        <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400"/>
    </g>
    <g opacity="0.25" color="#06b6d4">
        <use href="#hex" x="60" y="60" width="36" height="36"/>
        <use href="#hex" x="520" y="80" width="44" height="44"/>
        <use href="#hex" x="80" y="320" width="32" height="32"/>
        <use href="#hex" x="500" y="320" width="40" height="40"/>
    </g>
    <g opacity="0.4" fill="#22d3ee">
        <circle cx="50" cy="200" r="4"/><circle cx="560" cy="200" r="4"/>
        <circle cx="150" cy="40" r="3"/><circle cx="450" cy="360" r="3"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 380 50 L 460 50 L 460 90 L 520 90"/>
        <circle cx="380" cy="50" r="3" fill="#22d3ee"/><circle cx="520" cy="90" r="3" fill="#22d3ee"/>
        <rect x="430" y="65" width="20" height="20" rx="2"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 80 320 L 80 360 L 140 360"/>
        <path d="M 100 310 L 100 340"/>
        <circle cx="80" cy="320" r="3" fill="#22d3ee"/><circle cx="80" cy="360" r="3" fill="#22d3ee"/><circle cx="140" cy="360" r="3" fill="#22d3ee"/>
    </g>
    <g font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.55">
        <text x="40" y="120">01</text><text x="545" y="140">10</text>
        <text x="30" y="280">11</text><text x="555" y="290">01</text>
    </g>
    <g font-family="monospace" font-size="20" fill="#06b6d4" opacity="0.45" font-weight="bold">
        <text x="20" y="180">{ }</text><text x="545" y="240">{ }</text>
    </g>

    <ellipse cx="300" cy="335" rx="190" ry="8" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)"/>

    <!-- ===== MICROCONTROLLER HUB: Breadboard with MCU + WiFi + Sensors ===== -->
    <g transform="translate(150, 110)">
        <!-- Breadboard base -->
        <rect x="0" y="0" width="300" height="200" rx="10" fill="url(#pcb)" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
        <!-- Breadboard power rails -->
        <line x1="20" y1="20" x2="280" y2="20" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
        <line x1="20" y1="28" x2="280" y2="28" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
        <line x1="20" y1="172" x2="280" y2="172" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
        <line x1="20" y1="180" x2="280" y2="180" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
        <!-- Breadboard hole dots -->
        <g fill="#0a0e1a" opacity="0.6">
            <!-- top row holes -->
            <g><circle cx="30" cy="20" r="1.2"/><circle cx="50" cy="20" r="1.2"/><circle cx="70" cy="20" r="1.2"/><circle cx="90" cy="20" r="1.2"/><circle cx="110" cy="20" r="1.2"/><circle cx="130" cy="20" r="1.2"/><circle cx="150" cy="20" r="1.2"/><circle cx="170" cy="20" r="1.2"/><circle cx="190" cy="20" r="1.2"/><circle cx="210" cy="20" r="1.2"/><circle cx="230" cy="20" r="1.2"/><circle cx="250" cy="20" r="1.2"/><circle cx="270" cy="20" r="1.2"/></g>
            <g><circle cx="30" cy="28" r="1.2"/><circle cx="50" cy="28" r="1.2"/><circle cx="70" cy="28" r="1.2"/><circle cx="90" cy="28" r="1.2"/><circle cx="110" cy="28" r="1.2"/><circle cx="130" cy="28" r="1.2"/><circle cx="150" cy="28" r="1.2"/><circle cx="170" cy="28" r="1.2"/><circle cx="190" cy="28" r="1.2"/><circle cx="210" cy="28" r="1.2"/><circle cx="230" cy="28" r="1.2"/><circle cx="250" cy="28" r="1.2"/><circle cx="270" cy="28" r="1.2"/></g>
            <!-- main rows -->
            <g><circle cx="30" cy="60" r="1.5"/><circle cx="50" cy="60" r="1.5"/><circle cx="70" cy="60" r="1.5"/><circle cx="90" cy="60" r="1.5"/><circle cx="110" cy="60" r="1.5"/><circle cx="130" cy="60" r="1.5"/><circle cx="150" cy="60" r="1.5"/><circle cx="170" cy="60" r="1.5"/><circle cx="190" cy="60" r="1.5"/><circle cx="210" cy="60" r="1.5"/><circle cx="230" cy="60" r="1.5"/><circle cx="250" cy="60" r="1.5"/><circle cx="270" cy="60" r="1.5"/></g>
            <g><circle cx="30" cy="140" r="1.5"/><circle cx="50" cy="140" r="1.5"/><circle cx="70" cy="140" r="1.5"/><circle cx="90" cy="140" r="1.5"/><circle cx="110" cy="140" r="1.5"/><circle cx="130" cy="140" r="1.5"/><circle cx="150" cy="140" r="1.5"/><circle cx="170" cy="140" r="1.5"/><circle cx="190" cy="140" r="1.5"/><circle cx="210" cy="140" r="1.5"/><circle cx="230" cy="140" r="1.5"/><circle cx="250" cy="140" r="1.5"/><circle cx="270" cy="140" r="1.5"/></g>
        </g>
        <!-- Center channel -->
        <rect x="0" y="95" width="300" height="10" fill="#0a0e1a" opacity="0.3"/>

        <!-- ESP32 module (center) -->
        <g transform="translate(115, 75)">
            <rect x="0" y="0" width="70" height="50" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
            <rect x="5" y="5" width="60" height="40" rx="2" fill="#0a0e1a" stroke="#06b6d4" stroke-width="0.8"/>
            <text x="35" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#22d3ee" font-weight="bold">ESP32</text>
            <text x="35" y="32" text-anchor="middle" font-family="monospace" font-size="6" fill="#22d3ee" opacity="0.7">WiFi+BT</text>
            <!-- GPIO pins left -->
            <g fill="#22d3ee" opacity="0.7"><rect x="-3" y="6" width="3" height="2"/><rect x="-3" y="12" width="3" height="2"/><rect x="-3" y="18" width="3" height="2"/><rect x="-3" y="24" width="3" height="2"/><rect x="-3" y="30" width="3" height="2"/><rect x="-3" y="36" width="3" height="2"/><rect x="-3" y="42" width="3" height="2"/></g>
            <!-- GPIO pins right -->
            <g fill="#22d3ee" opacity="0.7"><rect x="70" y="6" width="3" height="2"/><rect x="70" y="12" width="3" height="2"/><rect x="70" y="18" width="3" height="2"/><rect x="70" y="24" width="3" height="2"/><rect x="70" y="30" width="3" height="2"/><rect x="70" y="36" width="3" height="2"/><rect x="70" y="42" width="3" height="2"/></g>
            <!-- Power LED -->
            <circle cx="55" cy="42" r="1.5" fill="#22c55e" filter="url(#glow)"/>
        </g>

        <!-- WiFi signal (top right of board) -->
        <g transform="translate(245, 45)" opacity="0.9">
            <path d="M -10 5 Q 0 -5, 10 5" stroke="#22d3ee" stroke-width="1.5" fill="none" filter="url(#glow)"/>
            <path d="M -7 5 Q 0 -1, 7 5" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8"/>
            <path d="M -4 5 Q 0 1, 4 5" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6"/>
            <circle cx="0" cy="6" r="1.5" fill="#22d3ee"/>
        </g>

        <!-- Sensor (left) - small chip with 3 legs -->
        <g transform="translate(40, 70)">
            <rect x="0" y="0" width="35" height="22" rx="2" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
            <text x="17" y="15" text-anchor="middle" font-family="monospace" font-size="6" fill="#22d3ee">SENSE</text>
            <g stroke="#22d3ee" stroke-width="0.8"><line x1="6" y1="22" x2="6" y2="30"/><line x1="17" y1="22" x2="17" y2="30"/><line x1="28" y1="22" x2="28" y2="30"/></g>
        </g>

        <!-- LED (right) -->
        <g transform="translate(240, 80)">
            <circle r="6" fill="#fbbf24" stroke="#22d3ee" stroke-width="1" filter="url(#glow)"/>
            <line x1="0" y1="6" x2="0" y2="20" stroke="#22d3ee" stroke-width="0.8"/>
            <line x1="0" y1="-6" x2="0" y2="-12" stroke="#22d3ee" stroke-width="0.8"/>
        </g>

        <!-- Connection wires -->
        <g stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7">
            <path d="M 57 81 Q 80 100, 112 95"/>
            <path d="M 188 100 Q 215 95, 240 86"/>
            <path d="M 150 125 L 150 160"/>
        </g>
    </g>

    <!-- Floating Arduino icon (top right) -->
    <g transform="translate(465, 70)" opacity="0.85">
        <rect x="-18" y="-12" width="36" height="24" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/>
        <rect x="-14" y="-8" width="28" height="14" rx="1" fill="#0a0e1a"/>
        <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="7" fill="#22d3ee" font-weight="bold">MC</text>
        <g fill="#22d3ee" opacity="0.6">
            <rect x="-18" y="-8" width="2" height="2"/><rect x="-18" y="-2" width="2" height="2"/><rect x="-18" y="4" width="2" height="2"/>
            <rect x="18" y="-8" width="2" height="2"/><rect x="18" y="-2" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/>
        </g>
    </g>

    <!-- Chip icon -->
    <g transform="translate(170, 130)">
        <rect width="22" height="22" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/>
        <rect x="5" y="5" width="12" height="12" rx="1" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
        <g stroke="#22d3ee" stroke-width="0.8" opacity="0.7">
            <line x1="-3" y1="6" x2="0" y2="6"/><line x1="-3" y1="11" x2="0" y2="11"/><line x1="-3" y1="16" x2="0" y2="16"/>
            <line x1="22" y1="6" x2="25" y2="6"/><line x1="22" y1="11" x2="25" y2="11"/><line x1="22" y1="16" x2="25" y2="16"/>
        </g>
    </g>

    <!-- Glowing M badge -->
    <g transform="translate(450, 165)">
        <circle r="48" fill="#22d3ee" opacity="0.18" filter="url(#softGlow)"/>
        <circle r="38" fill="#0a0e1a" stroke="url(#cGrad)" stroke-width="3"/>
        <circle r="32" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
        <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="url(#cGrad)">μC</text>
        <g stroke="#22d3ee" stroke-width="1.5" opacity="0.7">
            <line x1="0" y1="-30" x2="0" y2="-26"/><line x1="0" y1="26" x2="0" y2="30"/>
            <line x1="-30" y1="0" x2="-26" y2="0"/><line x1="26" y1="0" x2="30" y2="0"/>
        </g>
    </g>

    <line x1="150" y1="210" x2="450" y2="210" stroke="#22d3ee" stroke-width="0.5" opacity="0.15"/>
</svg>