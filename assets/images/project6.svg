<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Logic Lab">
    <defs>
        <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <symbol id="hex" viewBox="-10 -10 20 20">
            <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </symbol>
    </defs>

    <g opacity="0.12" stroke="#06b6d4" stroke-width="0.5" fill="none">
        <path d="M 0 80 L 600 80 M 0 160 L 600 160 M 0 240 L 600 240 M 0 320 L 600 320"/>
        <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400"/>
    </g>
    <g opacity="0.25" color="#06b6d4">
        <use href="#hex" x="60" y="60" width="36" height="36"/>
        <use href="#hex" x="520" y="80" width="44" height="44"/>
        <use href="#hex" x="80" y="320" width="32" height="32"/>
        <use href="#hex" x="500" y="320" width="40" height="40"/>
    </g>
    <g opacity="0.4" fill="#22d3ee">
        <circle cx="50" cy="200" r="4"/><circle cx="560" cy="200" r="4"/>
        <circle cx="150" cy="40" r="3"/><circle cx="450" cy="360" r="3"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 380 50 L 460 50 L 460 90 L 520 90"/>
        <circle cx="380" cy="50" r="3" fill="#22d3ee"/><circle cx="520" cy="90" r="3" fill="#22d3ee"/>
        <rect x="430" y="65" width="20" height="20" rx="2"/>
    </g>
    <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.5">
        <path d="M 80 320 L 80 360 L 140 360"/>
        <path d="M 100 310 L 100 340"/>
        <circle cx="80" cy="320" r="3" fill="#22d3ee"/><circle cx="80" cy="360" r="3" fill="#22d3ee"/><circle cx="140" cy="360" r="3" fill="#22d3ee"/>
    </g>
    <g font-family="monospace" font-size="11" fill="#22d3ee" opacity="0.55">
        <text x="40" y="120">01</text><text x="545" y="140">10</text>
        <text x="30" y="280">11</text><text x="555" y="290">01</text>
    </g>
    <g font-family="monospace" font-size="20" fill="#06b6d4" opacity="0.45" font-weight="bold">
        <text x="20" y="180">{ }</text><text x="545" y="240">{ }</text>
    </g>

    <ellipse cx="300" cy="335" rx="190" ry="8" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)"/>

    <!-- ===== LOGIC LAB: Gate diagram + Truth table + Waveform ===== -->
    <g transform="translate(150, 95)">
        <!-- Logic circuit card -->
        <rect x="0" y="0" width="300" height="220" rx="12" fill="url(#frame)" stroke="#06b6d4" stroke-width="1.5"/>
        <rect x="0" y="0" width="300" height="22" rx="12" fill="#1e293b"/>
        <rect x="0" y="14" width="300" height="8" fill="#1e293b"/>
        <circle cx="12" cy="11" r="3" fill="#ef4444"/>
        <circle cx="22" cy="11" r="3" fill="#fbbf24"/>
        <circle cx="32" cy="11" r="3" fill="#22c55e"/>
        <text x="148" y="15" text-anchor="middle" font-family="monospace" font-size="8" fill="#22d3ee">logic.lab</text>

        <!-- ===== Gate diagram (left side) ===== -->
        <g transform="translate(20, 40)">
            <!-- Input lines A and B -->
            <line x1="0" y1="20" x2="20" y2="20" stroke="#22d3ee" stroke-width="1.2"/>
            <line x1="0" y1="80" x2="20" y2="80" stroke="#22d3ee" stroke-width="1.2"/>
            <!-- Input labels -->
            <text x="-5" y="24" text-anchor="end" font-family="monospace" font-size="8" fill="#22d3ee" font-weight="bold">A</text>
            <text x="-5" y="84" text-anchor="end" font-family="monospace" font-size="8" fill="#22d3ee" font-weight="bold">B</text>
            <!-- AND gate -->
            <g transform="translate(20, 30)">
                <path d="M 0 0 L 0 60 L 30 60 A 30 30 0 0 0 30 0 Z" fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.5"/>
                <text x="15" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee" font-weight="bold">&amp;</text>
            </g>
            <!-- Output line from AND gate -->
            <line x1="80" y1="60" x2="105" y2="60" stroke="#22d3ee" stroke-width="1.2"/>
            <!-- OR gate -->
            <g transform="translate(105, 30)">
                <path d="M 0 0 Q 15 0, 30 30 Q 15 60, 0 60 Q 10 30, 0 0 Z" fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.5"/>
                <text x="15" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee" font-weight="bold">≥1</text>
            </g>
            <!-- Output to NOT gate -->
            <line x1="135" y1="60" x2="160" y2="60" stroke="#22d3ee" stroke-width="1.2"/>
            <line x1="160" y1="60" x2="160" y2="80" stroke="#22d3ee" stroke-width="1.2"/>
            <!-- NOT gate (triangle + circle) -->
            <g transform="translate(160, 75)">
                <path d="M 0 0 L 16 10 L 0 20 Z" fill="#0a0e1a" stroke="#22d3ee" stroke-width="1.5"/>
                <circle cx="19" cy="10" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
                <line x1="22" y1="10" x2="35" y2="10" stroke="#22d3ee" stroke-width="1.2"/>
            </g>
            <!-- Final output -->
            <text x="205" y="89" font-family="monospace" font-size="8" fill="#22d3ee" font-weight="bold">Y</text>
            <circle cx="200" cy="85" r="2" fill="#22c55e" filter="url(#glow)"/>

            <!-- Branch A and B into both gates -->
            <path d="M 0 20 L -10 20 L -10 30 L 20 30" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7"/>
            <path d="M 0 20 L -10 20 L -10 60 L 20 60" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7"/>
            <path d="M 0 80 L -10 80 L -10 60 L 20 60" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7"/>
            <path d="M 0 80 L -10 80 L -10 90 L 20 90" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.7"/>
            <line x1="20" y1="30" x2="20" y2="90" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
            <line x1="105" y1="30" x2="105" y2="90" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
        </g>

        <!-- ===== Truth table (right top) ===== -->
        <g transform="translate(220, 35)">
            <text x="0" y="0" font-family="monospace" font-size="7" fill="#22d3ee" opacity="0.7">TRUTH TABLE</text>
            <line x1="0" y1="4" x2="60" y2="4" stroke="#22d3ee" stroke-width="0.5" opacity="0.4"/>
            <g font-family="monospace" font-size="7" text-anchor="middle">
                <!-- Header -->
                <text x="10" y="16" fill="#22d3ee" font-weight="bold">A</text>
                <text x="30" y="16" fill="#22d3ee" font-weight="bold">B</text>
                <text x="50" y="16" fill="#22d3ee" font-weight="bold">Y</text>
                <line x1="0" y1="20" x2="60" y2="20" stroke="#22d3ee" stroke-width="0.5" opacity="0.4"/>
                <!-- Row 1: 0 0 -> 1 -->
                <text x="10" y="32" fill="#e2e8f0">0</text>
                <text x="30" y="32" fill="#e2e8f0">0</text>
                <text x="50" y="32" fill="#22c55e" font-weight="bold">1</text>
                <!-- Row 2: 0 1 -> 0 -->
                <text x="10" y="44" fill="#e2e8f0">0</text>
                <text x="30" y="44" fill="#e2e8f0">1</text>
                <text x="50" y="44" fill="#ef4444" font-weight="bold">0</text>
                <!-- Row 3: 1 0 -> 0 -->
                <text x="10" y="56" fill="#e2e8f0">1</text>
                <text x="30" y="56" fill="#e2e8f0">0</text>
                <text x="50" y="56" fill="#ef4444" font-weight="bold">0</text>
                <!-- Row 4: 1 1 -> 0 -->
                <text x="10" y="68" fill="#e2e8f0">1</text>
                <text x="30" y="68" fill="#e2e8f0">1</text>
                <text x="50" y="68" fill="#ef4444" font-weight="bold">0</text>
            </g>
        </g>

        <!-- ===== Digital waveform (bottom) ===== -->
        <g transform="translate(20, 155)">
            <text x="0" y="0" font-family="monospace" font-size="7" fill="#22d3ee" opacity="0.7">WAVEFORM</text>
            <!-- Waveform background -->
            <rect x="0" y="8" width="260" height="44" rx="2" fill="#000" opacity="0.4"/>
            <!-- Grid lines -->
            <g stroke="#22d3ee" stroke-width="0.3" opacity="0.2">
                <line x1="0" y1="20" x2="260" y2="20"/>
                <line x1="0" y1="40" x2="260" y2="40"/>
                <line x1="40" y1="8" x2="40" y2="52"/>
                <line x1="80" y1="8" x2="80" y2="52"/>
                <line x1="120" y1="8" x2="120" y2="52"/>
                <line x1="160" y1="8" x2="160" y2="52"/>
                <line x1="200" y1="8" x2="200" y2="52"/>
                <line x1="240" y1="8" x2="240" y2="52"/>
            </g>
            <!-- Signal A: 0 0 1 1 -->
            <path d="M 0 15 L 80 15 L 80 45 L 200 45 L 200 15 L 260 15" stroke="#22d3ee" stroke-width="1.5" fill="none" filter="url(#glow)"/>
            <text x="0" y="-2" font-family="monospace" font-size="6" fill="#22d3ee">A</text>
            <!-- Signal B: 0 1 0 1 -->
            <path d="M 0 30 L 40 30 L 40 50 L 120 50 L 120 30 L 200 30 L 200 50 L 260 50" stroke="#a78bfa" stroke-width="1.2" fill="none" opacity="0.8"/>
            <text x="0" y="62" font-family="monospace" font-size="6" fill="#a78bfa">B</text>
        </g>
    </g>

    <!-- Floating XOR gate symbol (top right) -->
    <g transform="translate(465, 70)" opacity="0.85">
        <path d="M 0 -10 Q 8 0, 0 10 Q 5 0, 0 -10 Z" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
        <line x1="-8" y1="-10" x2="-8" y2="10" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#22d3ee" font-weight="bold">⊕</text>
    </g>

    <!-- Floating NAND gate (bottom right) -->
    <g transform="translate(465, 325)" opacity="0.9">
        <rect x="-15" y="-10" width="20" height="20" rx="2" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
        <text x="-5" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22d3ee" font-weight="bold">&amp;</text>
        <circle cx="9" cy="0" r="2.5" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    </g>

    <!-- Chip icon -->
    <g transform="translate(170, 130)">
        <rect width="22" height="22" rx="3" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/>
        <rect x="5" y="5" width="12" height="12" rx="1" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.6"/>
        <g stroke="#22d3ee" stroke-width="0.8" opacity="0.7">
            <line x1="-3" y1="6" x2="0" y2="6"/><line x1="-3" y1="11" x2="0" y2="11"/><line x1="-3" y1="16" x2="0" y2="16"/>
            <line x1="22" y1="6" x2="25" y2="6"/><line x1="22" y1="11" x2="25" y2="11"/><line x1="22" y1="16" x2="25" y2="16"/>
        </g>
    </g>

    <!-- Glowing L badge -->
    <g transform="translate(450, 165)">
        <circle r="48" fill="#22d3ee" opacity="0.18" filter="url(#softGlow)"/>
        <circle r="38" fill="#0a0e1a" stroke="url(#cGrad)" stroke-width="3"/>
        <circle r="32" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
        <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="url(#cGrad)">L</text>
        <g stroke="#22d3ee" stroke-width="1.5" opacity="0.7">
            <line x1="0" y1="-30" x2="0" y2="-26"/><line x1="0" y1="26" x2="0" y2="30"/>
            <line x1="-30" y1="0" x2="-26" y2="0"/><line x1="26" y1="0" x2="30" y2="0"/>
        </g>
    </g>

    <line x1="150" y1="210" x2="450" y2="210" stroke="#22d3ee" stroke-width="0.5" opacity="0.15"/>
</svg>