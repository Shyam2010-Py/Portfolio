<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GP Monogram">
  <title>GP Monogram</title>
  <!-- Chip pins -->
  <g fill="#4F46E5">
    <rect x="20" y="4"  width="3" height="7" rx="1"/>
    <rect x="30.5" y="4"  width="3" height="7" rx="1"/>
    <rect x="41" y="4"  width="3" height="7" rx="1"/>
    <rect x="20" y="53" width="3" height="7" rx="1"/>
    <rect x="30.5" y="53" width="3" height="7" rx="1"/>
    <rect x="41" y="53" width="3" height="7" rx="1"/>
    <rect x="4"  y="20" width="7" height="3" rx="1"/>
    <rect x="4"  y="30.5" width="7" height="3" rx="1"/>
    <rect x="4"  y="41" width="7" height="3" rx="1"/>
    <rect x="53" y="20" width="7" height="3" rx="1"/>
    <rect x="53" y="30.5" width="7" height="3" rx="1"/>
    <rect x="53" y="41" width="7" height="3" rx="1"/>
  </g>
  <!-- Chip body -->
  <rect x="11" y="11" width="42" height="42" rx="9" fill="#0B1020" stroke="#00D4FF" stroke-width="2"/>
  <!-- Inner PCB outline -->
  <rect x="17" y="17" width="30" height="30" rx="5" fill="none" stroke="#4F46E5" stroke-width="1.2" opacity="0.65"/>
  <!-- Corner circuit nodes -->
  <g fill="#00E676">
    <circle cx="17" cy="17" r="1.8"/>
    <circle cx="47" cy="17" r="1.8"/>
    <circle cx="17" cy="47" r="1.8"/>
    <circle cx="47" cy="47" r="1.8"/>
  </g>
  <!-- Monogram -->
  <text x="32" y="40" text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="22" font-weight="800"
        fill="#FFFFFF" letter-spacing="-0.5">GP</text>
</svg>
