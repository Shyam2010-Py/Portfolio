<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="Ghanashyam Pabbuleti">
  <title>GP — Ghanashyam Pabbuleti</title>
  <!-- Microchip / monogram tile -->
  <g>
    <!-- Chip pins (top + bottom) -->
    <g fill="#4F46E5">
      <rect x="32" y="2"  width="2" height="6" rx="1"/>
      <rect x="42" y="2"  width="2" height="6" rx="1"/>
      <rect x="52" y="2"  width="2" height="6" rx="1"/>
      <rect x="32" y="52" width="2" height="6" rx="1"/>
      <rect x="42" y="52" width="2" height="6" rx="1"/>
      <rect x="52" y="52" width="2" height="6" rx="1"/>
    </g>
    <!-- Chip body -->
    <rect x="14" y="8" width="58" height="44" rx="8" fill="#0B1020" stroke="#00D4FF" stroke-width="1.5"/>
    <!-- Inner PCB trace ring -->
    <rect x="20" y="14" width="46" height="32" rx="5" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.55"/>
    <!-- GP monogram (readable) -->
    <text x="43" y="40" text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="22" font-weight="800"
          fill="#FFFFFF" letter-spacing="-0.5">GP</text>
    <!-- Accent signal node -->
    <circle cx="66" cy="30" r="2.6" fill="#00E676"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Inter, Arial, sans-serif" fill="#0B1020">
    <text x="84" y="28" font-size="15" font-weight="800" letter-spacing="-0.2">Ghanashyam</text>
    <text x="84" y="46" font-size="11" font-weight="500" fill="#4F46E5" letter-spacing="0.4">PABBULeTI · ECE</text>
  </g>
  <!-- Trace tail from chip to text baseline (subtle PCB feel) -->
  <path d="M72 30 H80" stroke="#00D4FF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="30" r="1.6" fill="#00D4FF"/>
</svg>
